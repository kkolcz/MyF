<div class="container-right-sidebar" [class.collapsed]="isCollapsed$()">
  <button class="toggle-button" (click)="toggleSidebar()">
    <i
      [class]="
        isCollapsed$() ? 'bi bi-arrow-bar-left' : 'bi bi-arrow-bar-right'
      "
    ></i>
  </button>
  <div class="sidebar-content">
    <div class="search-bar">
      @if(!isCollapsed$()) {
      <app-chat-user-bar-invitation />
      @for(invitation of invitations(); track invitation.id) {
      <div>
        <chat-user-bar-invitation-item
          [invitation]="invitation"
        ></chat-user-bar-invitation-item>
      </div>
      } @for(user of friends(); track user.id) {
      <div>
        {{ user.firstName }} {{ user.lastName }}
        <app-friend-user-bar-item
          [user]="user"
          [isFriend]="true"
        ></app-friend-user-bar-item>
      </div>
      } }
    </div>
  </div>
</div>
