<div
  class="user-bar-item"
  (click)="onLeftClick()"
  (contextmenu)="onRightClick($event)"
>
  <div
    class="user-status"
    [ngClass]="{ online: user.online, offline: !user.online }"
  ></div>
  <div class="user-info">
    <p class="user-nickname">{{ user.firstName }} {{ user.lastName }}</p>
    <p class="user-last-seen" *ngIf="true">
      Ostatnio widziany: {{ user.lastSeen | date : "short" }}
    </p>
  </div>
</div>
