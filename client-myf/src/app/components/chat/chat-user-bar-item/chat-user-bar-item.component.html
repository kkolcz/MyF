<div
  class="user-bar-item"
  (click)="onLeftClick()"
  (contextmenu)="onRightClick($event)"
>
  <div
    class="user-status"
    [ngClass]="{ online: user.isOnline, offline: !user.isOnline }"
  ></div>
  <div class="user-info">
    <p class="user-nickname">{{ user.nickname }}</p>
    <p class="user-last-seen" *ngIf="!user.isOnline">
      Ostatnio widziany: {{ user.lastSeen | date : "short" }}
    </p>
  </div>
</div>
