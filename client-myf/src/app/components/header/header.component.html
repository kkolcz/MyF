<div class="header-container">
  <h1>MyF</h1>
  <div
    class="user-menu"
    (click)="onLeftClick()"
    (contextmenu)="onRightClick($event)"
  >
    <ng-container *ngIf="user.avatarUrl; else initials">
      <img class="user-avatar" [src]="user.avatarUrl" alt="User Avatar" />
    </ng-container>
    <ng-template #initials>
      <div class="user-initials">{{ getInitials(user.fullNamed) }}</div>
    </ng-template>
    <div class="user-info">
      <p class="user-nickname">{{ user.fullNamed }}</p>
      <p
        class="user-status"
        [ngClass]="{ online: user.isOnline, offline: !user.isOnline }"
      >
        {{ user.isOnline ? "Online" : "Offline" }}
      </p>
    </div>
  </div>
</div>
